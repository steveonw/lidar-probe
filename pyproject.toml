[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scene_probe"
version = "0.1.0"
description = "Closed-loop active perception over symbolic 3D scenes. Built on scene_lens."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
    "Pillow>=9.0",
    "scene_lens>=0.2.1",
]
keywords = ["active-perception", "predictive-coding", "scene-fitting",
            "analysis-by-synthesis", "next-best-view", "raycasting",
            "llm-agent", "verification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

[project.urls]
# Update these to your own GitHub/GitLab URLs when publishing
Homepage = "https://github.com/USERNAME/scene_probe"
Issues = "https://github.com/USERNAME/scene_probe/issues"
"Related project" = "https://github.com/USERNAME/scene_lens"

[tool.setuptools.packages.find]
include = ["scene_probe*"]
exclude = ["tests*", "examples*"]
